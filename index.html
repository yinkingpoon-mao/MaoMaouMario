  <style>

    .btn:hover { opacity: 0.9; }
    section {

    }
    h2 { font-size: 1.15rem; font-weight: 500; margin: 0 0 12px; }
    p { margin: 0 0 12px; }

    ul.links a { display: flex; justify-content: space-between; padding: 12px 0; color: var(--text); text-decoration: none; }
    ul.links a span { color: var(--muted); }
    ul.links a:hover { color: var(--accent); }
    footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 40px; }
